<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LPZ Appz — simple Android utilities.">
  <title>LPZ Appz</title>
  <style>
    :root{color-scheme:light dark;--bg:#0f1115;--card:#171a21;--text:#f3f4f6;--muted:#a9b0bd;--accent:#78a9ff;--border:#2a2f3a}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
    main{width:min(720px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.25)}
    h1{margin:0 0 8px;font-size:clamp(2rem,6vw,3.2rem)} p{line-height:1.6;color:var(--muted)}
    a{display:inline-block;margin-top:16px;color:var(--accent);font-weight:700;text-decoration:none} a:hover{text-decoration:underline}
    .app{margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <main>
    <h1>LPZ Appz</h1>
    <p>Simple Android utilities built to do one job well.</p>
    <section class="app">
      <h2>Ampz Live Charge Widget</h2>
      <p>Live charging amps, volts and watts on your Android home screen.</p>
      <a href="/ampz/privacy/">Privacy Policy</a>
    </section>
  </main>
</body>
</html>
